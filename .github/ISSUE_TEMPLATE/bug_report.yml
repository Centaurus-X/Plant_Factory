name: Bug report
description: Report reproducible Plant Factory behavior using sanitized data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private plant data or vulnerability details.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 64_r6 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, browser and viewport
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Attach only synthetic or sanitized project/SVG data.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: The reproduction does not target live equipment without explicit authorization.
          required: true
        - label: I removed credentials and confidential plant information.
          required: true
