name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - name: Verify immutable publication manifest
        run: python _tools/create_sha256_manifest.py --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --ignore-scripts
      - name: Functional style
        run: |
          python _tools/check_functional_style.py
          node _tools/check_js_functional_style.cjs
      - name: Current release contracts
        run: |
          python _tools/build_symbol_standard.py --check
          python _tools/build_logic_library.py --check
          python test/test_security.py
          python test/test_server_api.py
          python test/test_v64_r6_release.py
          python test/test_v64_r6_server.py
          node test/test_logic_core.mjs
          node test/test_automation_contract.mjs
          node test/test_v64_r6_model.mjs

  browser-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install complete release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm install --ignore-scripts
      - name: Complete Linux release gate
        run: ./test_all.sh
