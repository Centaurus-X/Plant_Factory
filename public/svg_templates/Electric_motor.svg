<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 80" width="90" height="80" role="img" class="pf-pid-v1" data-pf-standard="PF-PID-V1" data-pf-family="electric-motor" preserveAspectRatio="xMidYMid meet">
<style>
